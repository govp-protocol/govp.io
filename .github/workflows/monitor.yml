name: public protocol monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govp-public-monitor
  cancel-in-progress: false

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the exact public verifier
        run: python -m pip install --disable-pip-version-check govp==0.1.11

      - name: Resolve the current release record from discovery
        id: release
        run: |
          record_url="$(curl --fail --silent --show-error \
            https://govp.io/.well-known/govp/index.json \
            | python -c 'import json, sys; payload=json.load(sys.stdin); matches=[item["record"] for item in payload["records"] if item["asset"] == "https://github.com/govp-protocol/govp/releases/download/v0.1.11/GOVP-0.1.11-source.zip" and item["asset_sha256"] == "89d45080fbdff7cca7efbaf1027d205ed14295c1d33e6a35be4722bb88c0296a"]; assert len(matches) == 1; print(matches[0])')"
          echo "record_url=${record_url}" >> "$GITHUB_OUTPUT"

      - name: Verify canonical identity, discovered record and live status
        env:
          RELEASE_RECORD_URL: ${{ steps.release.outputs.record_url }}
        run: |
          govp verify-url https://govp.io/.well-known/govp.txt
          govp verify-url https://govp.io/.well-known/govp/GOVP-DOC-1863bfac05f9.govp
          govp verify-url "$RELEASE_RECORD_URL"
          govp status-url https://govp.io/.well-known/govp.txt \
            --status-url https://govp.io/.well-known/govp/revoked.json
          govp status-url "$RELEASE_RECORD_URL" \
            --status-url https://govp.io/.well-known/govp/revoked.json

      - name: Validate public HTTP contracts
        run: |
          curl --fail --silent --show-error --location https://govp.io/ >/dev/null
          curl --fail --silent --show-error https://govp.io/.well-known/govp/index.json \
            | python -m json.tool >/dev/null
          curl --fail --silent --show-error https://govp.io/.well-known/govp/revoked.json \
            | python -m json.tool >/dev/null
          curl --fail --silent --show-error https://govp.io/PROTOCOL-SOURCE.json \
            | python -m json.tool >/dev/null
          curl --fail --silent --show-error --head \
            https://govp.io/.well-known/govp/revoked.json \
            | tr -d '\r' | grep -i '^cache-control: no-store$'
          test "$(curl --fail --silent --show-error --location \
            https://github.com/govp-protocol/govp/releases/download/v0.1.11/GOVP-0.1.11-source.zip \
            | sha256sum | cut -d' ' -f1)" = \
            '89d45080fbdff7cca7efbaf1027d205ed14295c1d33e6a35be4722bb88c0296a'
