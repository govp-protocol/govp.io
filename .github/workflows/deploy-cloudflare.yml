name: deploy-cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govp-io-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Use Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check govp==0.1.13

      - name: Rebuild and validate the versioned site
        run: |
          npm run build
          git diff --exit-code
          npm test
          npm audit --audit-level=low
          npm run check:deploy

      - name: Build and verify the real static publication
        env:
          GOVP_PUBLICATION_DOMAIN_KEY: ${{ secrets.GOVP_PUBLICATION_DOMAIN_KEY }}
        run: |
          key_path="$RUNNER_TEMP/govp-publication-domain.pem"
          public_path="$RUNNER_TEMP/govp-publication-site"
          custody_path="$RUNNER_TEMP/govp-publication-custody"
          proof_path="$RUNNER_TEMP/govp-publication-proof.json"
          printf '%s' "$GOVP_PUBLICATION_DOMAIN_KEY" > "$key_path"
          chmod 600 "$key_path"
          python tools/build-publication-demo.py \
            --domain-key "$key_path" \
            --public-dir "$public_path" \
            --custody-dir "$custody_path" \
            --export-proof "$proof_path"
          cp -R "$public_path/.well-known/." .well-known/
          cp "$proof_path" govp/examples/publication-proof.json
          govp publication verify govp/examples/publication-proof.json --tree .
          test "$(find "$custody_path/proofs" -type f | wc -l | tr -d ' ')" = 2
          test "$(find .well-known -type f -name '*sealed*' | wc -l | tr -d ' ')" = 0

      - name: Retain private synthetic custody separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: govp-publication-custody-${{ github.run_id }}
          path: ${{ runner.temp }}/govp-publication-custody/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy the validated Worker
        run: npm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
